plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zombienation.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zombienation.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs out of the box.
            // Swap in your own keystore before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
